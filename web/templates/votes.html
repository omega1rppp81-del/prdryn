{% extends "base.html" %}
{% block title %}Голосования — Совет{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">Голосования</h1>
        <div class="flex space-x-2">
            <select id="status-filter" class="bg-discord-input border border-gray-600 rounded-lg px-3 py-2 text-sm">
                <option value="">Все статусы</option>
                <option value="draft">Черновик</option>
                <option value="scheduled">Запланировано</option>
                <option value="open">Открыто</option>
                <option value="paused">Приостановлено</option>
                <option value="completed">Завершено</option>
                <option value="cancelled">Отменено</option>
            </select>
        </div>
    </div>

    <div id="votes-table" class="bg-discord-sidebar rounded-xl border border-gray-700 overflow-hidden">
        <table class="w-full">
            <thead class="bg-discord-input">
                <tr>
                    <th class="px-4 py-3 text-left text-sm font-semibold text-gray-300">№</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold text-gray-300">Название</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold text-gray-300">Статус</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold text-gray-300">Тип</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold text-gray-300">Явка</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold text-gray-300">Создано</th>
                </tr>
            </thead>
            <tbody id="votes-body">
                <tr><td colspan="6" class="px-4 py-8 text-center text-gray-400">Выберите сервер</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const user = {{ user | tojson }};
    let currentGuild = null;

    const statusLabels = {
        draft: 'Черновик',
        scheduled: 'Запланировано',
        open: 'Открыто',
        paused: 'Приостановлено',
        completed: 'Завершено',
        cancelled: 'Отменено',
        archived: 'Архивировано'
    };

    const statusClasses = {
        draft: 'bg-gray-700 text-gray-300',
        scheduled: 'bg-yellow-900 text-yellow-300',
        open: 'bg-green-900 text-green-300',
        paused: 'bg-yellow-900 text-yellow-300',
        completed: 'bg-blue-900 text-blue-300',
        cancelled: 'bg-red-900 text-red-300',
        archived: 'bg-gray-700 text-gray-400'
    };

    const typeLabels = {
        standard: 'Стандартное',
        no_abstain: 'Без воздержания',
        single_choice: 'Выбор варианта',
        multi_choice: 'Множественный',
        ranked: 'Рейтинговое',
        weighted: 'С весами'
    };

    async function loadGuilds() {
        if (!user.guilds || user.guilds.length === 0) return;
        currentGuild = user.guilds[0].id;
        loadVotes();
    }

    async function loadVotes() {
        if (!currentGuild) return;
        const status = document.getElementById('status-filter').value;
        const params = status ? `?status=${status}` : '';

        try {
            const res = await fetch(`/api/guilds/${currentGuild}/votes${params}`);
            const votes = await res.json();
            const tbody = document.getElementById('votes-body');

            if (votes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-400">Нет голосований</td></tr>';
                return;
            }

            tbody.innerHTML = votes.map(v => `
                <tr class="border-t border-gray-700 hover:bg-discord-input cursor-pointer"
                    onclick="window.location='/votes/${v.id}'">
                    <td class="px-4 py-3 text-sm text-gray-400">#${v.vote_number}</td>
                    <td class="px-4 py-3">
                        <div class="font-semibold">${v.title}</div>
                        <div class="text-xs text-gray-400">${v.category || ''}</div>
                    </td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded text-xs ${statusClasses[v.status] || ''}">${statusLabels[v.status] || v.status}</span>
                    </td>
                    <td class="px-4 py-3 text-sm text-gray-300">${typeLabels[v.vote_type] || v.vote_type}</td>
                    <td class="px-4 py-3 text-sm">${v.total_voted}</td>
                    <td class="px-4 py-3 text-sm text-gray-400">${v.created_at ? new Date(v.created_at).toLocaleDateString('ru-RU') : '—'}</td>
                </tr>
            `).join('');
        } catch (e) {
            console.error('Error:', e);
        }
    }

    document.getElementById('status-filter').addEventListener('change', loadVotes);
    loadGuilds();
</script>
{% endblock %}
